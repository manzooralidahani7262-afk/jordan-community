<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Community Info</title>
    <meta name="description" content="Join Jordan Community for market updates and discussion">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a); 
            color: white; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .box { 
            border: 3px solid gold; 
            padding: 35px 25px; 
            border-radius: 20px; 
            background: #111; 
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }
        h1 { color: gold; font-size: 28px; margin-bottom: 12px; }
        .text { color: #ccc; margin: 20px 0; line-height: 1.8; font-size: 16px; }
        .btn { 
            display: block; 
            background: linear-gradient(90deg, #FFD700, #FFA500); 
            color: #000; 
            padding: 18px; 
            margin: 14px 0; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.03); background: linear-gradient(90deg, #FFA500, #FFD700); }
        .footer { color: #777; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Jordan Community Updates</h1>
        <p class="text">
            Welcome to Jordan Community Updates<br>
            Join us for Market Updates & Discussion<br>
            Click below to join our Telegram
        </p>
        
        <a href="https://t.me/JordanCommunityUpdates" class="btn" target="_blank">🚀 Join Telegram Channel 🚀</a>
        <a href="https://t.me/JordanCommunityUpdates" class="btn" target="_blank">📊 Join Updates Group 📊</a>

    </div>

</html>
