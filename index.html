<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Community Updates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a); 
            color: white; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .box { 
            border: 3px solid #0088cc; 
            padding: 40px 30px; 
            border-radius: 20px; 
            background: #111; 
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 136, 204, 0.3);
        }
        h1 { 
            color: #0088cc; 
            font-size: 28px; 
            margin-bottom: 15px; 
        }
        .text { 
            color: #ccc; 
            margin: 20px 0; 
            line-height: 1.8; 
            font-size: 16px; 
        }
        .btn { 
            display: block; 
            background: linear-gradient(90deg, #0088cc, #00aaff); 
            color: #fff; 
            padding: 18px; 
            margin: 14px 0; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            transition: 0.3s;
        }
        .btn:hover { 
            transform: scale(1.03); 
        }
        .footer { 
            color: #777; 
            font-size: 12px; 
            margin-top: 25px; 
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Jordan Community Updates</h1>
        <p class="text">
            Welcome to Official Community<br>
            Click below to Join via Bot<br>
            You will be redirected to channel
        </p>
        
        <!-- یہ بوٹ والا لنک ہے -->
        <a href="https://t.me/mansoorali122bot?start=join_channel" class="btn" target="_blank">🚀 Join Channel via Bot 🚀</a>
        
        <p class="footer">
            For educational purposes only.<br>
            Not financial advice.
        </p>
    </div>
</body>
</html>
